services:
  backend:
    build: ./backend
    env_file:
      - .env
    container_name: demandcast_backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always

  frontend:
    build: ./frontend
    container_name: demandcast_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

  redis:
    image: redis:7-alpine
    container_name: demandcast_redis
    ports:
      - "6379:6379"
    restart: always

  rq_worker:
    build:
      context: ./backend
      dockerfile: dockerfile.worker
    container_name: demandcast_worker
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always
