# =====================
# PRICING & RETURNS
# =====================

pricing:
  vat_percent: 18
  shipping_cost_mean: 50
  shipping_cost_stddev: 20
  return_rate: 0.05

# ======================
# INVENTORY SIMULATION
# ======================

inventory_rules:
  lead_time_days_range: [3, 15]
  reorder_level_factor: 0.2
  stockout_probability: 0.03
  reorder_delay_probability: 0.05

# ====================
# CUSTOMER BEHAVIOR
# ====================

customer_behavior:
  loyalty_segments:
    - name: "Bronze"
      order_frequency: 0.5
    - name: "Silver"
      order_frequency: 1.0
    - name: "Gold"
      order_frequency: 1.5
    - name: "Platinum"
      order_frequency: 2.0

